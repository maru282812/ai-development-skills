const SKILLS = [{"name":"business-discovery","category":"Project Discovery","tier":"deep","summary":"Project Discovery の Phase5（Business Discovery）担当。事業として成立する前提・収益構造・顧客価値・優先ターゲット・成功条件を発見し、MVP時点の事業仮説を1本立てる。財務予測・PL作成はしない。","triggers":["事業として成立するか整理したい","ビジネスモデルを固めたい","誰に何を売るのか決めたい","収益化するか無料運用かを判断したい","事業観点のKPIを出して","初期ユーザーをどう集めるか整理して"],"description":"Project Discovery の Phase5（Business Discovery）担当。収益計画書やPLを作るスキルではない。 project / scope / metrics の成果物を入力に、「このプロダクトが事業として成立するための前提・収益構造・ 顧客価値・優先ターゲット・提供価値・成功条件」を発見し、business/ 配下に整理する。 誰に何をどの価値で提供するか / 収益モデル / 優先顧客 / 提供価値の差別化 / 初期流入経路 / 事業観点KPI を発見し、MVP時点で成立させる事業仮説を1本立てる。 トリガー例: 「事業として成立するか整理したい」「ビジネスモデルを固めたい」「誰に何を売るのか決めたい」 「収益化するか無料運用かを判断したい」「事業観点のKPIを出して」「初期ユーザーをどう集めるか整理して」。 入力は [[scope-discovery]] / [[requirements-discovery]] / [[metrics-discovery]] の成果物。 詳細財務予測・PL作成はしない。契約詳細は [[contract-discovery]] / [[legal-discovery]]、運用体制は [[operations-discovery]]、非機能は [[nfr-discovery]]、事業リスクは [[risk-discovery]] へ渡す。 [[project-discovery]] から参照され、[[discovery-planner]] / [[discovery-auditor]] のループ内で動く。","count":0},{"name":"contract-discovery","category":"Project Discovery","tier":"deep","summary":"Project Discovery の契約発見担当。「誰と・何を・どの条件で契約するか」を発見・整理する（提供範囲/対象外/SLA/返金/成果物権利/責任範囲など）。契約書は作らず条件は断定しない。","triggers":["契約条件を整理したい","提供範囲と対象外を決めたい","SLAを決めたい","返金・キャンセル条件を固めたい","成果物の権利を整理して","責任範囲を明確にしたい","外注やNDAが要るか洗い出して"],"description":"Project Discovery の契約発見担当。法務文書・契約書を作成するスキルではない。 サービス提供後のトラブルを防ぐために「誰と・何を・どの条件で契約するか」を発見・整理する工程。 契約相手（顧客 / パートナー / 外部委託 / データ委託）と、合意形成に必要な契約条件 （提供範囲 / 対象外 / サポート / 保守運用 / SLA / 返金・キャンセル / 成果物権利 / データ所有権 / 責任範囲 / 契約終了）を発見し、contract/contract-inventory.md / contract/contract.md / contract/contract-open-questions.md を生成する。トリガー例: 「契約条件を整理したい」「提供範囲と対象外を決めたい」 「SLAを決めたい」「返金・キャンセル条件を固めたい」「成果物の権利を整理して」「責任範囲を明確にしたい」 「外注やNDAが要るか洗い出して」。AIは契約条件を断定しない（専門家確認を促す）。 実務上の依存順は requirements → data → contract → legal。入力は [[requirements-discovery]] / [[data-discovery]] / [[business-discovery]] / [[operations-discovery]] / [[integration-discovery]] の成果物。 契約書本文の起案・適法性判断は [[legal-discovery]] / 専門家へ。深掘りは [[discovery-planner]] で1テーマずつ、 横断監査は [[discovery-auditor]]。","count":0},{"name":"data-discovery","category":"Project Discovery","tier":"standard","summary":"Project Discovery の Phase9（Data Discovery）担当。「何のデータを扱うサービスか」を確定する（扱う情報/取得元/更新責任者/保持期間/削除条件/個人情報/システム境界）。DB設計・テーブル・ER図はしない。","triggers":["何のデータを扱うか整理して","データの責任範囲を決めたい","保存する情報を洗い出して","個人情報がどこにあるか出して","外部システムとの境界を整理して"],"description":"Project Discovery の Phase9（Data Discovery）担当。DB設計をするスキルではない。 「そもそも何のデータを扱うサービスなのか」を、画面・機能・運営・法務・リスク検討の結果として確定する。 扱う情報 / 取得元 / 生成場所 / 更新責任者 / 流れ / 保持期間 / 削除条件 / 所有権 / 個人情報 / システム境界 を発見し data/data.md を生成する。法務(Phase7)とリスク(Phase8)の半分はここに依存する。 トリガー例: 「何のデータを扱うか整理して」「データの責任範囲を決めたい」「保存する情報を洗い出して」 「個人情報がどこにあるか出して」「外部システムとの境界を整理して」。 実装方法・テーブル・カラム・ER図・API・インフラは決めない（それは後工程）。 深掘りは [[discovery-planner]] で1テーマずつ、横断監査は [[discovery-auditor]]。","count":1},{"name":"discovery-auditor","category":"Project Discovery","tier":"deep","summary":"Project Discovery の最終監査担当。decisions.md と全フェーズ成果物を横断し、決定と仮置きの混同・Phase間の矛盾・幽霊ドキュメント・未昇格仮置きの漏れ・MVPの線を検出してレポートを出し、サイクルを止める。","triggers":["discovery を監査して","抜け漏れ・矛盾を確認して","実装に渡せる状態か見て"],"description":"Project Discovery の最終監査役（旧称 project-auditor）。[[agent-tester]] の「軽量に横断検証して 止める」思想を、コード検証ではなく **ドキュメント横断監査** に移植したもの。typecheck / test / git diff は走らせない（discovery に実行コードは無い）。代わりに decisions.md と全フェーズ成果物を 横断し、(1)決定 vs 仮置きの混同、(2)Phase間の矛盾、(3)成果物リストにあるのに生成されていない 幽霊ドキュメント、(4)未昇格の仮置きが下流へ漏れる事故、(5)MVPの線が引かれているか、を検出して 構造化レポートを出し、サイクルを止める。実装ループの agent-tester とは別物で混同してはならない。 トリガー例: 「discovery を監査して」「抜け漏れ・矛盾を確認して」「実装に渡せる状態か見て」。","count":0},{"name":"discovery-planner","category":"Project Discovery","tier":"deep","summary":"Project Discovery の意思決定プランナー担当。現在フェーズを仮置きで埋め切って完走させ、フェーズ末に「仮置き＋人間必須の要確認」を1枚の表で一括提示する。人しか決められない核は仮置きにしない。","triggers":["次のフェーズを進めて","discovery を1フェーズ進めて","フェーズ末の確認を出して","次に決めるべきことを整理して"],"description":"Project Discovery 専用のプランナー。[[agent-planner]] の「停止ゲートで止める」思想を、コード実装ではなく **意思決定** に移植したもの。git diff は読まない（discovery 段階に diff は無い）。代わりに decisions.md / open-questions.md と各フェーズ成果物を読み、現在フェーズを仮置き(assumption)で 埋め切って完走させ、フェーズ末に「仮置き＋人間必須の要確認」を1枚の確認表にまとめて一括提示する （フェーズ途中では止めない＝/loop と相性が良い）。人しか決められない核（事業意図・課金・対象ユーザー・ 責任範囲）は仮置きにせず要確認に上げる。実装ループの agent-planner とは別物で、混同してはならない。 トリガー例: 「次のフェーズを進めて」「discovery を1フェーズ進めて」「フェーズ末の確認を出して」 「次に決めるべきことを整理して」。[[project-discovery]] の各フェーズ進行で使う。","count":1},{"name":"integration-discovery","category":"Project Discovery","tier":"standard","summary":"Project Discovery の Phase10（Integration Discovery）担当。外部との接続点・依存先・連携責任を発見する（外部サービス/認証/通知/決済/データ入出力/失敗時対応）。API仕様・Webhook設計・技術選定はしない。","triggers":["外部連携を整理したい","使う外部サービスを洗い出して","決済が必要か整理して","誰のアカウントで契約するか決めたい","通知の送り先と失敗時対応を決めたい","CSV取り込み・PDF出力の要否を整理して","外部API停止時の扱いを詰めたい"],"description":"Project Discovery の Phase10（Integration Discovery）担当。外部API設計や実装方式を決めるスキルではない。 「プロジェクト外部との接続点・依存先・連携責任を発見する」工程。requirements / data / operations / business の成果物を入力に、 何と連携する必要があるのか / 誰が管理するのか / 失敗時にどう扱うのかを明確化する。外部サービス / 認証・本人確認 / 通知 / 決済・請求 / データ入出力 / 外部API依存 / 失敗時対応 を発見し integration/ 配下に整理する。 トリガー例: 「外部連携を整理したい」「使う外部サービスを洗い出して」「決済が必要か整理して」 「誰のアカウントで契約するか決めたい」「通知の送り先と失敗時対応を決めたい」「CSV取り込み・PDF出力の要否を整理して」 「外部API停止時の扱いを詰めたい」。入力は [[requirements-discovery]] / [[data-discovery]] / [[operations-discovery]] / [[business-discovery]] の成果物。API仕様・Webhook設計・OAuthスコープ・DB・ER図・インフラ・技術選定はしない。 外部停止/API制限/通知未達/決済失敗は [[risk-discovery]]、レート制限・同期頻度・可用性要求は [[nfr-discovery]]、 利用規約・手数料・SLA・サポート条件は [[contract-discovery]] へ渡す。 [[project-discovery]] から参照され、[[discovery-planner]] / [[discovery-auditor]] のループ内で動く。","count":0},{"name":"legal-discovery","category":"Project Discovery","tier":"deep","summary":"Project Discovery の Phase7（Legal Discovery）担当。公開・運営・課金・個人情報管理に「何の法務成果物が必要か」を発見する（利用規約/プラポリ/特商法/同意/返金・削除ポリシー等）。法的助言は断定しない。","triggers":["必要な法務書類を洗い出して","利用規約やプライバシー ポリシーが要るか整理して","特商法表記が必要か確認して","公開前に法務面の抜け漏れを潰したい","個人情報まわりで何を用意すべきか出して"],"description":"Project Discovery の Phase7（Legal Discovery）担当。「どの法律が適用されるか」を調べるスキルではない。 サービスを公開・運営・課金・個人情報管理するために「何の法務成果物が必要か」を ality-tooling","category":"実装計画","tier":"standard","summary":"新規案件の lint/format 初期セットアップ担当。スタックを検出して（TS→Biome / Swift→SwiftLint+SwiftFormat / Kotlin→ktlint）、設定ファイル・scripts・README まで一貫生成する。スタック越境はしない。","triggers":["新規案件にLinter/Formatterを入れたい","Biome入れて","iOSのコード整形ツールを設定して","この案件にどの静的解析ツールが要るか判定して","初期テンプレートにlint/format設定を入れて","Android Kotlinの整形ツールを整理して","コード品質ツールを初期セットアップして","初期化時のツール選定と雛形生成"],"description":"新規案件の初期化時に「プロジェクト種別に応じて、どのコード整形・静的解析ツールを導入すべきか」を判定し、 設定ファイル・scripts・README まで一貫して生成するセットアップ・スキル。 スタック検出（Web/SaaS/管理画面/API・iOS・Android・その他）→ ツール選定 → 雛形生成 を行う。 TypeScript/JavaScript 系（Next.js/React/Node API）→ Biome、 Swift/iOS 系（SwiftUI/UIKit）→ SwiftLint + SwiftFormat、 Kotlin/Android 系 → ktlint（候補: detekt / Spotless）を選定する。 Biome を Swift へ、SwiftLint/SwiftFormat を Next.js へ入れない（スタック越境を禁止）。 対象外・未対応スタックは無理に導入せず「確認事項」として提示する。 生成物は biome.json / .swiftlint.yml / .swiftformat / .editorconfig 等の設定ファイル、 package.json scripts や gradle 設定、README/運用メモ、作業ログ。トリガー例: 「新規案件にLinter/Formatterを入れたい」「Biome入れて」「iOSのコード整形ツールを設定して」 「この案件にどの静的解析ツールが要るか判定して」「初期テンプレートにlint/format設定を入れて」 「Android Kotlinの整形ツールを整理して」「コード品質ツールを初期セットアップして」。 要件・スコープの発見はしない（それは [[scope-discovery]] / [[requirements-discovery]]）。 非機能要件としての保守性方針は [[nfr-discovery]]、実装手順分解は [[implementation-planner]] が担当。 本スキルは「初期化時のツール選定と雛形生成」に特化する。","count":0},{"name":"refactor-planner","category":"実装計画","tier":"deep","summary":"リファクタ計画づくり担当。既存挙動を壊さず、責務分離・共通化・ファイル分割を段階的に進める計画を作る（機能追加は伴わない）。","triggers":["リファクタして","共通化して","責務分離して","重複を減らして","service / repository に分けて","ファイルが大きい","保守しやすくして","既存挙動を壊さず整理して"],"description":"既存の挙動を壊さずに、責務分離・共通化・ファイル分割を段階的に進める リファクタリング計画を作成するスキル。トリガー例: 「リファクタして」「共通化して」「責務分離して」「重複を減らして」 「service / repository に分けて」「ファイルが大きい」「保守しやすくして」 「既存挙動を壊さず整理して」「このコンポーネント分割して」 「コードを整理したい」。 既存コードの構造改善・整理・分割が含まれる依頼ではこのスキルを使用する。 機能追加を伴う場合は implementation-planner と組み合わせる。","count":0},{"name":"adversarial-review","category":"レビュー・テスト","tier":"deep","summary":"コード以外の判断物（料金・事業仮説・提供範囲・計画・見積り）を敵対視点で潰す汎用レッドチーム担当。複数の攻撃視点で前提の甘さ・反例・失敗シナリオ ate）→ remote origin 連携 → 初回 push、までを一気通貫で実行する。 ユーザーが「git作成」と言ったら、たとえ明示的に手順を列挙していなくても、このスキルを使うこと。 破壊的操作（.git の作り直し）と外向き操作（GitHubリポジトリ作成・push）を含むため、 誤爆防止の安全ガード（ドライブ直下/ホーム直下では実行拒否・既存.gitは削除せず退避）を必ず通す。 要件定義・スコープ整理はしない（それは [[requirements-discovery]] / [[project-discovery]] / [[scope-discovery]]）。 本スキルは「新規プロジェクトの git/GitHub 初期化」だけに特化する。git作成が終わったら要件定義へ引き渡す。","count":6},{"name":"handover-package","category":"セットアップ・運用","tier":"standard","summary":"アプリ販売・譲渡の引き渡し資料づくり担当。環境変数一覧（値は書かない）・外部サービス名義切替・運用手順・法務掲載状況・開発用の後始末を handover/ 配下にまとめる。","triggers":["引き渡し資料を作って","販売用の引き継ぎパッケージを作って","譲渡ドキュメントをまとめて","名義切替の手順を出して","このアプリを売る準備をして","引き継ぎに何が要るか洗い出して","引き渡せる形"],"description":"アプリを販売・譲渡・移管するときの「引き渡し資料一式」を handover/ 配下に生成するスキル。 環境変数一覧（キー名と取得場所のみ・値は書かない）/ 外部サービス一覧と名義切替手順 / 運用手順 / 法務文書の掲載状況 / 開発用の後始末（ops-guide剥がし・テストデータ削除）/ 未解決事項 をまとめ、買い手・引き継ぎ先がそのまま運用を開始できる状態にする。 トリガー例: 「引き渡し資料を作って」「販売用の引き継ぎパッケージを作って」 「譲渡ドキュメントをまとめて」「名義切替の手順を出して」「このアプリを売る準備をして」 「引き継ぎに何が要るか洗い出して」。 運営手順パネルのアプリ内埋め込みは [[ops-guide-embedder]]（本スキルはその剥がし手順を含む）、 運用業務の発見は [[operations-discovery]]、外部連携の整理は [[integration-discovery]]、 法務文書の掲載管理は [[legal-publication-manager]] を使う。 本スキルは既存成果物とリポジトリ実態を「引き渡せる形」に集約することに特化する。","count":0},{"name":"ops-guide-embedder","category":"セットアップ・運用","tier":"standard","summary":"運営者向け操作手順パネルの埋め込み担当。番号付き実行手順（場所タグ＋コピー可能なコマンド/実行文）を features/ops-guide/ に隔離埋め込みする。販売時はフォルダ削除＋マウント1箇所除去で一括剥がせる。","triggers":["作業手順をサイトに書いて","作業手順をサイトに入れて","作業手順を画面に出して","操作手順をサイトに入れて","使い方パネルを埋め込んで","運営手順を画面に表示して","実行手順パネルを作って","runbook をサイトに埋め込んで"],"description":"要件定義書から作るサイトに、運営者向けの「操作手順（番号付き実行手順パネル）」を 1つの隔離ディレクトリとして埋め込む実装スキル。手順には各ステップの実行場所タグ （サイト / Claude Code / 他プロジェクト連携）と、コピー可能なコマンド・ディスパッチ実行文が付き、 選択中プロジェクトの slug から c:\\work\\{slug} を動的生成する（testmaster-client の howto パネルと同じ思想）。 最大の狙いは2つ: (1) 現状「操作手順が分かりにくい」問題を、画面内の実行手順パネルで解消する。 (2) 販売・引き渡し時に features/ops-guide/ をフォルダごと削除＋マウント1箇所を消すだけで 操作手順が完全に消えるよう、最初から隔離しておく。 トリガー例:「作業手順をサイトに書いて」「作業手順をサイトに入れて」「作業手順を画面に出して」 「操作手順をサイトに入れて」「使い方パネルを埋め込んで」「運営手順を画面に表示して」 「実行手順パネルを作って」「runbook をサイトに埋め込んで」「どこで何をするか画面に出して」 「ディスパッチの実行文を手順として並べて」「販売用に操作手順を後で一括削除できる形で入れて」。 「作業手順 / 操作手順 / 実行手順 / 運営手順」をサイト・画面に「書いて / 入れて / 出して / 表示して / 埋め込んで」 という依頼、または後で剥がしたいという話が出たら、明示的に「このスキルを使って」と言われなくても 必ずこのスキルを使うこと。 要件自体の探索は [[requirements-discovery]]、ディスパッチ方式そのものの設計は [[dispatch-pattern-builder]]、画面設計全体は [[screen-design-architect]] に任せる。","count":0},{"name":"agent-planner","category":"その他","tier":"deep","summary":"自発改善ループで次の一手を決める担当。git diff とテスターの検証レポートを読み、未達抽出→優先順位付け→次に実装すべき作業を1件に絞った「Claude Code用指示文」を出す。大規模実装はせず確認チェックリストで止まる。","triggers":["Claude Code用指示文"],"description":"Use after agent-tester has produced a検証レポート (or after a Claude Code implementation) to decide the single next step. Reads git diff + the tester report, summarizes the change, extracts unmet requirements, scans side-effect / DB / cache impact, prioritizes a backlog, and emits ONE short, scope-limited「Claude Code用指示文」as a code block. Does NOT implement large changes; DB changes are proposed and stopped. Always ends the cycle with a confirmation checklist for the user.","count":1},{"name":"agent-tester","category":"その他","tier":"standard","summary":"実装直後の軽量検証担当。typecheck / test / lint・git diff・副作用/画面崩れ/DB/キャッシュ影響をスキャンして構造化した「検証レポート」を出す。軽微な修正のみ行い、ユーザー確認で止まる。","triggers":["検証レポート"],"description":"Use right after Claude Code implements a change (or before agent-planner plans the next step) to run the lightweight verification that does not need full Claude Code reasoning — typecheck / test / lint, git diff review, and a side-effect / 画面崩れ / DB / キャッシュ影響スキャン. May apply only minor fixes (UI文言・テスト微修正). Produces a structured「検証レポート」that agent-planner consumes, then STOPS the cycle for user confirmation.","count":0}];
const CATS   = ["Project Discovery","設計・調査","実装計画","レビュー・テスト","セットアップ・運用","その他"];
const COLORS = {"実装計画":"#10b981","Project Discovery":"#6366f1","設計・調査":"#0ea5e9","セットアップ・運用":"#ec4899","その他":"#64748b","レビュー・テスト":"#f59e0b"};

const q = document.getElementById('q');
const main = document.getElementById('main');
const catsEl = document.getElementById('cats');
const sortBtn = document.getElementById('sortbtn');
document.getElementById('total').textContent = SKILLS.length;
document.getElementById('totaluses').textContent =
  SKILLS.reduce((a,s)=>a+(s.count||0),0);

let active = 'ALL';
let byUsage = false;
const norm = s => (s||'').toLowerCase();

sortBtn.onclick = () => {
  byUsage = !byUsage;
  sortBtn.textContent = '並び: ' + (byUsage ? '使用回数順' : '分類順');
  sortBtn.classList.toggle('active', byUsage);
  if (byUsage) sortBtn.style.background = '#f59e0b';
  else sortBtn.style.background = '';
  render();
};

function makeCatBtn(label, color){
  const b = document.createElement('button');
  b.className = 'cat-btn' + (label===active?' active':'');
  b.textContent = label==='ALL' ? 'すべて' : label;
  if (label!=='ALL') b.style.borderColor = color;
  if (label===active) b.style.background = (label==='ALL' ? '#e2e8f0' : color);
  b.onclick = () => { active = label; render(); };
  return b;
}

function render(){
  // カテゴリボタン
  catsEl.innerHTML='';
  catsEl.appendChild(makeCatBtn('ALL', '#e2e8f0'));
  CATS.forEach(c => catsEl.appendChild(makeCatBtn(c, COLORS[c]||'#64748b')));

  const term = norm(q.value);
  const match = s => {
    if (active!=='ALL' && s.category!==active) return false;
    if (!term) return true;
    const hay = norm(s.name + ' ' + s.summary + ' ' + s.description + ' ' + (s.tier||'') + ' ' + (s.triggers||[]).join(' '));
    return hay.includes(term);
  };
  const list = SKILLS.filter(match);
  main.innerHTML='';
  if (!list.length){ main.innerHTML='<div class="empty">該当する skill がありません</div>'; return; }

  // 使用回数順モード: 分類をまたいで1リストにフラット表示
  if (byUsage) {
    const ranked = list.slice().sort((a,b)=>(b.count||0)-(a.count||0) || a.name.localeCompare(b.name));
    const title = document.createElement('div');
    title.className='group-title';
    title.innerHTML = '<span class="dot" style="background:#f59e0b"></span>使用回数順'+
                      '<span class="count">'+ranked.length+' skill</span>';
    main.appendChild(title);
    const grid = document.createElement('div'); grid.className='grid';
    ranked.forEach((s,i) => grid.appendChild(card(s, COLORS[s.category]||'#64748b', i+1)));
    main.appendChild(grid);
    return;
  }

  CATS.forEach(cat => {
    const items = list.filter(s => s.category===cat);
    if (!items.length) return;
    const color = COLORS[cat]||'#64748b';
    const title = document.createElement('div');
    title.className='group-title';
    title.innerHTML = '<span class="dot" style="background:'+color+'"></span>'+cat+
                      '<span class="count">'+items.length+' skill</span>';
    main.appendChild(title);
    const grid = document.createElement('div'); grid.className='grid';
    items.forEach(s => grid.appendChild(card(s, color)));
    main.appendChild(grid);
  });
}

function card(s, color, rank){
  const el = document.createElement('div'); el.className='card';
  const tags = (s.triggers||[]).map(t=>'<span class="chip">'+esc(t)+'</span>').join('');
  const n = s.count||0;
  const uses = '<span class="uses'+(n?'':' zero')+'" title="使用回数（全プロジェクト・全履歴）">'+
               (n? ('&#9650; '+n+' 回') : '未使用')+'</span>';
  const rankTag = rank ? '<span class="rank">#'+rank+'</span>' : '';
  el.innerHTML =
    '<div class="tags-row">'+rankTag+'<span class="tag" style="background:'+color+'">'+esc(s.category)+'</span>'+
    (s.tier?'<span class="tier tier-'+esc(s.tier)+'">'+esc(s.tier)+'</span>':'')+uses+'</div>'+
    '<h3>'+esc(s.name)+'</h3>'+
    '<p class="summary">'+esc(s.summary)+'</p>'+
    '<div class="launch">起動: <code>/'+esc(s.name)+'</code> または下のトリガー語を会話で言う</div>'+
    (tags?'<div class="chips">'+tags+'</div>':'')+
    (s.description?'<details><summary>説明全文</summary><p>'+esc(s.description)+'</p></details>':'');
  return el;
}
function esc(t){ return (t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

q.addEventListener('input', render);
render();

// localhost 配信時のみ: リロードのたびに最新カウントを取りに行く。
// file:// で開いた場合は fetch がブロックされるので、焼き込み値のまま表示（フォールバック）。
fetch('skill-usage.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : null)
  .then(u => {
    if (!u) return;
    SKILLS.forEach(s => s.count = u[s.name] || 0);
    document.getElementById('totaluses').textContent =
      SKILLS.reduce((a,s)=>a+(s.count||0),0);
    render();
  })
  .catch(()=>{});
</script>
</body>
