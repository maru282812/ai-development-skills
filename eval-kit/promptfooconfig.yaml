# =============================================================
# eval-kit エンジン（汎用・公式化する部分）
# -------------------------------------------------------------
# プロジェクトごとに触るのは基本「ここではなく」 cases/ と judge/。
# この設定ファイルは公式化したら原則いじらない（= エンジン）。
#
# 解決している2つの問題:
#   1) 一人で全部チェックできない → 承認済み golden と自動照合で回す
#   2) 同じ脳みそ問題            → 決定論アサーション + Judge分離(別系統採点)
# =============================================================
description: "AI出力の回帰テスト（決定論アサーション + Judge分離のLLM-as-Judge）"

# -------------------------------------------------------------
# 被験対象（System Under Test）= あなたのアプリ / モデル
# 2モード。プロジェクトに合わせてどちらかを有効化する。
# -------------------------------------------------------------
providers:
  # (A) アプリのエンドポイントを叩いて「実出力」を検証（推奨: 本番に最も近い）
  # - id: https
  #   config:
  #     url: "http://localhost:3000/api/answer"     # TODO: あなたのAPI
  #     method: POST
  #     headers: { "Content-Type": "application/json" }
  #     body:
  #       input: "{{user_input}}"
  #       official: "{{is_official}}"
  #     transformResponse: "json.answer"            # 出力テキストの取り出し方

  # (B) 生のモデルを直接検証（プロンプト単体の評価用）
  - id: openai:gpt-5-mini                           # 被験 = 高速モデル（本番想定）
    config:
      temperature: 0

# 被験プロンプト（= mode B で「テスト対象」になる挙動定義）。
#   ★プロジェクト固有: cases/ と同様に中身を差し替える。
#   mode A（アプリAPIを叩く）では未使用。
prompts:
  - file://prompts/under-test.md

# -------------------------------------------------------------
# Judge 分離（= 同じ脳みそ問題の対策）
# 自由回答(llm-rubric)の採点に使うモデル。被験と「別系統」にするのが肝。
#   最低ライン: 別モデル + ルーブリック固定 + 根拠引用必須(judge/rubric.md)
#   理想      : 別ベンダ/別世代にして自己選好バイアスを断つ
# -------------------------------------------------------------
defaultTest:
  options:
    provider:
      id: openai:gpt-5.4                            # Judge = 上位モデル（採点の信頼性確保）
      config:
        temperature: 0                              # 採点は決定論寄りに固定
    # 採点プロンプトを差し替え（根拠引用を強制し、甘い採点を防ぐ）
    rubricPrompt: file://judge/rubric.md

# -------------------------------------------------------------
# テストケース: 人間が承認した golden だけを読み込む。
# _template.golden.yaml.example は *.golden.yaml に一致しないので拾われない。
# -------------------------------------------------------------
tests: cases/*.golden.yaml
